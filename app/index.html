<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#faf7ef" />
    <meta name="description" content="PRV — a clear space for fast ideas and focused work." />
    <title>PRV AI</title>
    <script>
      try {
        const sessionTheme = window.sessionStorage.getItem('prv_theme_session_override');
        const prefersDark = window.matchMedia?.('(prefers-color-scheme: dark)').matches;
        if (sessionTheme === 'dark' || (sessionTheme !== 'light' && prefersDark)) {
          document.documentElement.classList.add('dark');
        }
      } catch {
        if (window.matchMedia?.('(prefers-color-scheme: dark)').matches) {
          document.documentElement.classList.add('dark');
        }
      }
    </script>
    <link rel="icon" type="image/svg+xml" href="/prv-mark.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
